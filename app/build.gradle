plugins {
    alias(libs.plugins.room)
}
apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasSigningConfig = keystorePropertiesFile.exists()

if (hasSigningConfig) {
    keystorePropertiesFile.withInputStream { input ->
        keystoreProperties.load(input)
    }
}

android {
    namespace 'com.sumon.bundleapp.installer'
    compileSdk 37

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.sumon.bundleapp.installer"
        minSdk 23
        targetSdk 36
        versionCode 61
        versionName "4.6"

        buildConfigField "int", "DEFAULT_THEME", "6"
        buildConfigField "int", "DEFAULT_DARK_THEME", "11"
    }

    // Phase 3 platform split (see BAI-ROADMAP-AND-TODO.md), built on main rather than the
    // another-update branch — main has none of that branch's leftover donation cruft, and the
    // manifest/build.gradle turned out identical between the two anyway. Same applicationId for
    // both flavors — a physical device only ever runs one Android generation, so there's no need
    // for them to coexist in production. (They also can't be installed side by side on one test
    // device this way; add an applicationIdSuffix here later if parallel QA installs matter.)
    flavorDimensions = ["platform"]

    productFlavors {
        legacy {
            dimension "platform"
            minSdk 23
            targetSdk 29
            versionNameSuffix "-legacy"
        }
        modern {
            dimension "platform"
            minSdk 30
            targetSdk 36
            versionNameSuffix "-modern"
        }
    }

    signingConfigs {
        release {
            if (hasSigningConfig) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )

            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Phase 3 (BAI-ROADMAP-AND-TODO.md): keep AGP 9.3-compatible APK naming.
// AGP 9.3 exposes onVariants(selector().all()), but VariantOutput.outputFileName was
// only added later. Let AGP create the split APKs normally, then rename the finished
// files in a finalizer task. This keeps the existing ABI split configuration unchanged.
//
// The finalizer is wired up inside onVariants() using tasks.matching(...).configureEach(),
// not tasks.named() — assemble<Variant> is not guaranteed to already be registered when
// onVariants() runs, and a direct tasks.named() lookup here intermittently failed with
// "Task with name 'assembleLegacyDebug' not found". tasks.matching().configureEach() waits
// for the task to appear instead of requiring it to exist already, and covers every
// flavor/build-type combination automatically instead of a hardcoded variant list.
androidComponents {
    def abiPattern = ~/.*-(armeabi-v7a|armeabi_v7a|arm64-v8a|arm64_v8a|x86_64|x86).*\.apk/
    def abiNames = [
            "armeabi_v7a": "armeabi-v7a",
            "arm64_v8a"  : "arm64-v8a"
    ]

    onVariants(selector().all()) { variant ->
        def variantName = variant.name
        def capitalizedVariant = variantName.capitalize()
        def renameTask = tasks.register("rename${capitalizedVariant}Apks") {
            dependsOn("package${capitalizedVariant}")

            doLast {
                def normalizedVariantName = variantName.toLowerCase()
                def flavor = normalizedVariantName.startsWith("legacy") ? "legacy" : "modern"
                def buildType = normalizedVariantName.endsWith("debug") ? "debug" : "release"
                def apkDir = file("$buildDir/outputs/apk/${flavor}/${buildType}")
                if (!apkDir.exists()) {
                    throw new GradleException("APK output directory does not exist: ${apkDir}")
                }

                def apks = apkDir.listFiles()?.findAll { it.isFile() && it.name.endsWith(".apk") } ?: []
                if (apks.isEmpty()) {
                    throw new GradleException("No APKs found in ${apkDir}")
                }

                apks.each { apk ->
                    def matcher = (apk.name =~ abiPattern)
                    if (!matcher.matches()) {
                        throw new GradleException("Could not determine ABI from APK filename: ${apk.name}")
                    }

                    def rawAbi = matcher[0][1]
                    def abi = abiNames.getOrDefault(rawAbi, rawAbi)
                    def target = new File(apkDir, "BAI-${flavor}-${buildType}-${abi}.apk")
                    if (apk != target) {
                        if (target.exists()) {
                            target.delete()
                        }
                        if (!apk.renameTo(target)) {
                            throw new GradleException("Failed to rename ${apk} to ${target}")
                        }
                    }
                }
            }
        }

        tasks.matching { it.name == "assemble${capitalizedVariant}" }.configureEach {
            finalizedBy(renameTask)
        }
    }
}

/*
 * Room schema export configuration.
 *
 * Room 2.8.4 exports database schemas during compilation.
 * The generated JSON files are written to app/schemas/.
 */
room {
    schemaDirectory "$projectDir/schemas"
}

dependencies {
    // Memory leak detection (debug builds only)
    debugImplementation libs.leakcanary.android

    // Local JAR/AAR dependencies (filepicker-release.aar excluded — see below, it's legacy-only)
    implementation fileTree(
            dir: 'libs',
            include: ['*.jar', '*.aar'],
            exclude: ['filepicker-release.aar']
    )

    // FilePicker library (com.github.angads25.filepicker): only Legacy's PlatformFilePicker
    // implementation offers/uses the internal picker UI — Modern relies solely on the system
    // SAF picker and never touches this library. See BAI-ROADMAP-AND-TODO.md, FilePicker
    // architecture, and platform/PlatformFilePicker.java.
    legacyImplementation files('libs/filepicker-release.aar')

    // AndroidX
    implementation libs.appcompat
    implementation libs.documentfile
    implementation libs.lifecycle.extensions1
    implementation libs.lifecycle.common.java8
    implementation libs.preference
    implementation libs.recyclerview

    // Material Design
    implementation libs.material

    // UI / Utilities
    implementation libs.glide
    annotationProcessor libs.compiler
    implementation libs.flexbox
    implementation libs.tooltips
    implementation libs.gson
    implementation libs.shimmer

    // Room
    def room_version = "2.8.4"
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    // Shizuku / Sui
    def shizuku_version = "13.1.5"
    implementation libs.api
    implementation libs.provider
    implementation libs.shared
    implementation libs.aidl

    // apksig: used by signing/SaiApkSigner.java for signature-scheme-aware APK (re-)signing
    implementation libs.apksig

    // flexfilter: vendored at com/aefyr/flexfilter/
    // pseudoapksigner: vendored at com/aefyr/pseudoapksigner/
}
