plugins {
    alias(libs.plugins.room)
}
apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasSigningConfig = keystorePropertiesFile.exists()

if (hasSigningConfig) {
    keystorePropertiesFile.withInputStream { input ->
        keystoreProperties.load(input)
    }
}

android {
    namespace 'com.sumon.bundleapp.installer'
    compileSdk 37

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.sumon.bundleapp.installer"
        minSdk 23
        targetSdk 36
        versionCode 61
        versionName "4.6"

        buildConfigField "int", "DEFAULT_THEME", "6"
        buildConfigField "int", "DEFAULT_DARK_THEME", "11"
    }

    // Phase 3 platform split (see BAI-ROADMAP-AND-TODO.md), built on main rather than the
    // another-update branch — main has none of that branch's leftover donation cruft, and the
    // manifest/build.gradle turned out identical between the two anyway. Same applicationId for
    // both flavors — a physical device only ever runs one Android generation, so there's no need
    // for them to coexist in production. (They also can't be installed side by side on one test
    // device this way; add an applicationIdSuffix here later if parallel QA installs matter.)
    flavorDimensions = ["platform"]

    productFlavors {
        legacy {
            dimension "platform"
            minSdk 23
            targetSdk 29
            versionNameSuffix "-legacy"
        }
        modern {
            dimension "platform"
            minSdk 30
            targetSdk 36
            versionNameSuffix "-modern"
        }
    }

    signingConfigs {
        release {
            if (hasSigningConfig) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )

            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Phase 3 (BAI-ROADMAP-AND-TODO.md): output naming, e.g. BAI-legacy-debug-armeabi-v7a.apk instead
// of AGP's default app-legacy-armeabi_v7a-debug.apk.
//
// CORRECTED: the previous version of this block used android.applicationVariants.all, which this
// project's actual CI run (logs_94305503106, "Analyze (java)" / Build (Gradle), 2026-09-14) showed
// fails outright on AGP 9.3.2 — "Could not get unknown property 'applicationVariants'" — because
// AGP 9 removed that API entirely rather than just deprecating it. Confirmed against Android's own
// "Build multiple APKs" and "Gradle tips and recipes" docs, which show this exact
// androidComponents.onVariants + FilterConfiguration replacement for AGP 9. This is now based on
// verified current documentation rather than the "stayed stable across the most AGP versions"
// guess the old comment made — but still unverified by an actual local build, since this sandbox
// has no Android SDK/Gradle network access. Confirm it resolves on your end.
androidComponents {
    onVariants { variant ->
        variant.outputs.forEach { output ->
            def abi = output.filters.find { it.filterType == com.android.build.api.variant.FilterConfiguration.FilterType.ABI }?.identifier
            def parts = ["BAI", variant.flavorName, variant.buildType]
            if (abi != null) {
                parts.add(abi)
            }
            output.outputFileName.set(parts.join("-") + ".apk")
        }
    }
}

/*
 * Room schema export configuration.
 *
 * Room 2.8.4 exports database schemas during compilation.
 * The generated JSON files are written to app/schemas/.
 */
room {
    schemaDirectory "$projectDir/schemas"
}

dependencies {
    // Memory leak detection (debug builds only)
    debugImplementation libs.leakcanary.android

    // Local JAR/AAR dependencies
    implementation fileTree(
            dir: 'libs',
            include: ['*.jar', '*.aar']
    )

    // AndroidX
    implementation libs.appcompat
    implementation libs.documentfile
    implementation libs.lifecycle.extensions1
    implementation libs.lifecycle.common.java8
    implementation libs.preference
    implementation libs.recyclerview

    // Material Design
    implementation libs.material

    // UI / Utilities
    implementation libs.glide
    annotationProcessor libs.compiler
    implementation libs.flexbox
    implementation libs.tooltips
    implementation libs.gson
    implementation libs.shimmer

    // Room
    def room_version = "2.8.4"
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    // Shizuku / Sui
    def shizuku_version = "13.1.5"
    implementation libs.api
    implementation libs.provider
    implementation libs.shared
    implementation libs.aidl

    // flexfilter: vendored at com/aefyr/flexfilter/
    // pseudoapksigner: vendored at com/aefyr/pseudoapksigner/
}