name: Mark stale issues and pull requests

on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest

    steps:
      - name: Mark stale issues and pull requests
        uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          days-before-stale: 60
          days-before-close: 7

          stale-issue-message: >-
            This issue hasn't had any activity for the last 60 days and will
            be automatically closed in 7 days from now.
          stale-pr-message: >-
            This pull request hasn't had any activity for the last 60 days and
            will be automatically closed in 7 days from now.

          stale-issue-label: no-issue-activity
          stale-pr-label: no-pr-activity
