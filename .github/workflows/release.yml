name: "Release"
 
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  build-and-release:
    name: Build APKs and publish GitHub Release
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
 
      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          verify-signature: true
 
      - name: Decode signing keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.BAI_KEYSTORE_BASE64 != '' }}
          BAI_KEYSTORE_BASE64: ${{ secrets.BAI_KEYSTORE_BASE64 }}
          BAI_KEYSTORE_PASSWORD: ${{ secrets.BAI_KEYSTORE_PASSWORD }}
          BAI_KEY_ALIAS: ${{ secrets.BAI_KEY_ALIAS }}
          BAI_KEY_PASSWORD: ${{ secrets.BAI_KEY_PASSWORD }}
        run: |
          echo "$BAI_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=${{ github.workspace }}/release.keystore
          storePassword=$BAI_KEYSTORE_PASSWORD
          keyAlias=$BAI_KEY_ALIAS
          keyPassword=$BAI_KEY_PASSWORD
          EOF
 
      - name: Build release APKs
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon
 
      - name: Locate and rename APKs
        id: apk
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          shopt -s nullglob
          SAFE_RELEASE_REF=${RELEASE_REF//[^A-Za-z0-9._-]/-}
          if [[ -z "$SAFE_RELEASE_REF" ]]; then
            echo "The release ref does not contain a valid filename component" >&2
            exit 1
          fi
          for APK_PATH in app/build/outputs/apk/release/*.apk; do
            ABI=$(basename "$APK_PATH" .apk | sed -E 's/^app-//; s/-release(-unsigned)?$//')
            cp "$APK_PATH" "dist/BAI-${SAFE_RELEASE_REF}-${ABI}.apk"
          done
          echo "dir=dist" >> "$GITHUB_OUTPUT"
 
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.apk.outputs.dir }}/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
ame "$APK_PATH" .apk | sed -E 's/^app-//; s/-release(-unsigned)?$//')
            cp "$APK_PATH" "dist/BAI-${SAFE_RELEASE_REF}-${ABI}.apk"
          done
          echo "dir=dist" >> "$GITHUB_OUTPUT"
 
      # NOTE: not SHA-pinned - could not confirm the full commit hash for the
      # latest release via search in a prior session. Verify and pin this
      # yourself once you can browse the repo directly.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.apk.outputs.dir }}/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
