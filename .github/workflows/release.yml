name: "Release"
 
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag to build and publish"
        required: true
        type: string

permissions:
  contents: write
 
jobs:
  build-and-release:
    name: Build APKs and publish GitHub Release
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
 
      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          verify-signature: true
 
      # Only runs when the BAI_KEYSTORE_BASE64 secret is set. Without it, the
      # build still produces unsigned app-<abi>-release-unsigned.apk files
      # (see below), so the workflow doesn't hard-fail just because signing
      # isn't set up yet.
      - name: Decode signing keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.BAI_KEYSTORE_BASE64 != '' }}
          BAI_KEYSTORE_BASE64: ${{ secrets.BAI_KEYSTORE_BASE64 }}
          BAI_KEYSTORE_PASSWORD: ${{ secrets.BAI_KEYSTORE_PASSWORD }}
          BAI_KEY_ALIAS: ${{ secrets.BAI_KEY_ALIAS }}
          BAI_KEY_PASSWORD: ${{ secrets.BAI_KEY_PASSWORD }}
        run: |
          echo "$BAI_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=${{ github.workspace }}/release.keystore
          storePassword=$BAI_KEYSTORE_PASSWORD
          keyAlias=$BAI_KEY_ALIAS
          keyPassword=$BAI_KEY_PASSWORD
          EOF
 
      - name: Build release APKs
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon
 
      # ABI splits produce one APK per architecture (armeabi-v7a, arm64-v8a,
      # x86, x86_64) instead of a single universal one - collect and rename
      # all of them.
      - name: Locate and rename APKs
        id: apk
        env:
          RELEASE_REF: ${{ inputs.release_tag }}
        run: |
          mkdir -p dist
          shopt -s nullglob
          SAFE_RELEASE_REF=${RELEASE_REF//[^A-Za-z0-9._-]/-}
          if [[ -z "$SAFE_RELEASE_REF" ]]; then
            echo "The release ref does not contain a valid filename component" >&2
            exit 1
          fi
          for APK_PATH in app/build/outputs/apk/release/*.apk; do
            ABI=$(basename "$APK_PATH" .apk | sed -E 's/^app-//; s/-release(-unsigned)?$//')
            cp "$APK_PATH" "dist/BAI-${SAFE_RELEASE_REF}-${ABI}.apk"
          done
          echo "dir=dist" >> "$GITHUB_OUTPUT"
 
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: ${{ steps.apk.outputs.dir }}/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
