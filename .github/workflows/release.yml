name: "Release"
 
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag to build and publish"
        required: true
        type: string

permissions:
  contents: write
 
jobs:
  build-and-release:
    name: Build APKs and publish GitHub Release
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
 
      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          verify-signature: true
 
      - name: Check signing secrets
        env:
          BAI_KEYSTORE_BASE64: ${{ secrets.BAI_KEYSTORE_BASE64 }}
          BAI_KEYSTORE_PASSWORD: ${{ secrets.BAI_KEYSTORE_PASSWORD }}
          BAI_KEY_ALIAS: ${{ secrets.BAI_KEY_ALIAS }}
          BAI_KEY_PASSWORD: ${{ secrets.BAI_KEY_PASSWORD }}
        run: |
          test -n "$BAI_KEYSTORE_BASE64" || { echo "::error::BAI_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$BAI_KEYSTORE_PASSWORD" || { echo "::error::BAI_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$BAI_KEY_ALIAS" || { echo "::error::BAI_KEY_ALIAS is missing"; exit 1; }
          test -n "$BAI_KEY_PASSWORD" || { echo "::error::BAI_KEY_PASSWORD is missing"; exit 1; }
          echo "Signing secrets are configured."

      - name: Decode signing keystore
        env:
          BAI_KEYSTORE_BASE64: ${{ secrets.BAI_KEYSTORE_BASE64 }}
          BAI_KEYSTORE_PASSWORD: ${{ secrets.BAI_KEYSTORE_PASSWORD }}
          BAI_KEY_ALIAS: ${{ secrets.BAI_KEY_ALIAS }}
          BAI_KEY_PASSWORD: ${{ secrets.BAI_KEY_PASSWORD }}
        run: |
          echo "$BAI_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=${{ github.workspace }}/release.keystore
          storePassword=$BAI_KEYSTORE_PASSWORD
          keyAlias=$BAI_KEY_ALIAS
          keyPassword=$BAI_KEY_PASSWORD
          EOF

      - name: Build release APKs
        run: |
          chmod +x ./gradlew
          ./gradlew assembleLegacyRelease assembleModernRelease --stacktrace --no-daemon
 
      # ABI splits produce one APK per architecture (armeabi-v7a, arm64-v8a,
      # x86, x86_64) instead of a single universal one, times two platform
      # generations (Phase 3) - collect and rename all eight of them.
      - name: Locate and rename APKs
        id: apk
        env:
          RELEASE_REF: ${{ inputs.release_tag }}
        run: |
          rm -rf dist
          mkdir -p dist
          shopt -s nullglob
          SAFE_RELEASE_REF=${RELEASE_REF//[^A-Za-z0-9._-]/-}
          if [[ -z "$SAFE_RELEASE_REF" ]]; then
            echo "The release ref does not contain a valid filename component" >&2
            exit 1
          fi
          for APK_PATH in app/build/outputs/apk/*/release/*.apk; do
            NAME=$(basename "$APK_PATH" .apk)
            # Matched against the known set of values rather than a fixed-position regex, so
            # this doesn't quietly break the next time the Gradle output naming changes.
            FLAVOR=$(grep -oE 'legacy|modern' <<< "$NAME")
            ABI=$(grep -oE 'armeabi-v7a|arm64-v8a|x86_64|x86' <<< "$NAME")
            if [[ -z "$FLAVOR" || -z "$ABI" ]]; then
              echo "::error::Could not determine flavor/ABI from APK filename: $NAME"
              exit 1
            fi
            cp "$APK_PATH" "dist/BAI-${SAFE_RELEASE_REF}-${FLAVOR}-${ABI}.apk"
          done
          echo "dir=dist" >> "$GITHUB_OUTPUT"

      - name: Validate the eight-APK build matrix
        run: |
          set -euo pipefail
          EXPECTED=8
          COUNT=$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)
          if [ "$COUNT" -ne "$EXPECTED" ]; then
            echo "::error::Expected $EXPECTED release APKs (2 platform generations x 4 ABIs), found $COUNT."
            ls -la dist
            exit 1
          fi
          for FLAVOR in legacy modern; do
            for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
              if ! ls dist | grep -qF -- "-${FLAVOR}-${ABI}.apk"; then
                echo "::error::Missing expected APK for $FLAVOR / $ABI."
                exit 1
              fi
            done
          done
          if find app/build/outputs/apk -iname '*universal*.apk' | grep -q .; then
            echo "::error::An unexpected universal APK was produced — universalApk should be false."
            exit 1
          fi
          echo "Build matrix OK: all 8 expected APKs present, no universal APK."
 
      - name: Verify APK signatures
        env:
          BAI_KEY_ALIAS: ${{ secrets.BAI_KEY_ALIAS }}
          BAI_KEYSTORE_PASSWORD: ${{ secrets.BAI_KEYSTORE_PASSWORD }}
        run: |
          set -e
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "::error::No Android build-tools directory found under \$ANDROID_HOME/build-tools."
            exit 1
          fi
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          if ! keytool -exportcert -alias "$BAI_KEY_ALIAS" -keystore release.keystore -storepass "$BAI_KEYSTORE_PASSWORD" > /tmp/expected_cert.der 2>/tmp/keytool_err.txt; then
            echo "::error::Could not export certificate for alias '$BAI_KEY_ALIAS' from the release keystore."
            cat /tmp/keytool_err.txt >&2
            exit 1
          fi
          EXPECTED_SHA256="$(sha256sum /tmp/expected_cert.der | awk '{print tolower($1)}')"

          found=0
          while IFS= read -r -d '' APK_PATH; do
            found=1
            echo "Verifying: $APK_PATH"
            APKSIGNER_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")"
            echo "$APKSIGNER_OUTPUT"
            # apksigner prints the digest colon-separated (F6:A0:1B:...);
            # strip the colons so it can be compared with sha256sum's plain hex.
            ACTUAL_SHA256="$(grep -i 'certificate SHA-256 digest' <<< "$APKSIGNER_OUTPUT" | head -n1 | sed 's/.*: //' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            if [ -z "$ACTUAL_SHA256" ]; then
              echo "::error::Could not extract certificate SHA-256 digest from $APK_PATH."
              exit 1
            fi
            if [ "$EXPECTED_SHA256" != "$ACTUAL_SHA256" ]; then
              echo "::error::$APK_PATH is not signed with the expected release key (alias '$BAI_KEY_ALIAS')."
              exit 1
            fi
            echo "Signature verified: $APK_PATH"
          done < <(find app/build/outputs/apk -type f -name '*.apk' -print0)
          if [ "$found" -eq 0 ]; then
            echo "::error::No APKs found to verify."
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: ${{ steps.apk.outputs.dir }}/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Which APK do I want?

            Eight APKs, built from one codebase — pick one row, then one column.

            | | armeabi-v7a | arm64-v8a | x86 | x86_64 |
            |---|---|---|---|---|
            | **Legacy** (Android 6–10) | `*-legacy-armeabi-v7a.apk` | `*-legacy-arm64-v8a.apk` | `*-legacy-x86.apk` | `*-legacy-x86_64.apk` |
            | **Modern** (Android 11–16) | `*-modern-armeabi-v7a.apk` | `*-modern-arm64-v8a.apk` | `*-modern-x86.apk` | `*-modern-x86_64.apk` |

            Most phones from the last few years are **arm64-v8a**. If you don't know your Android version, check Settings → About phone.
