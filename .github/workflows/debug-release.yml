name: "Debug Release"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    name: Build and publish debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          verify-signature: true

      - name: Build debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and rename APKs
        id: apk
        run: |
          mkdir -p dist
          shopt -s nullglob
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          for APK_PATH in app/build/outputs/apk/debug/*.apk; do
            ABI=$(basename "$APK_PATH" .apk | sed -E 's/^app-//; s/-debug$//')
            cp "$APK_PATH" "dist/BAI-debug-${SHORT_SHA}-${ABI}.apk"
          done
          echo "dir=dist" >> "$GITHUB_OUTPUT"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: BAI-debug-${{ steps.apk.outputs.short_sha }}
          path: ${{ steps.apk.outputs.dir }}/*.apk
          retention-days: 14

      - name: Publish rolling debug pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: debug-latest
          name: "Debug build (${{ github.ref_name }} @ ${{ github.sha }})"
          files: ${{ steps.apk.outputs.dir }}/*.apk
          prerelease: true
          generate_release_notes: false
          fail_on_unmatched_files: true
